name: m365-pull-v2 Static Web App Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# DO NOT "simplify" this to just github.ref. See docs/DEPLOYMENT_NOTES.md #1.
# For a pull_request event with action=closed, github.ref resolves to the BASE branch
# (refs/heads/main), not refs/pull/N/merge. Merging a PR fires both a push->main event
# and a pull_request closed event ~1s apart, so with a github.ref-only key they land in
# the SAME concurrency group, and cancel-in-progress makes the close run kill the
# production deploy before it reaches a runner. The close run deploys nothing (its
# build_and_deploy_job is skipped by the if: guard) — it only tears down the PR preview.
# Including github.event_name keeps push deploys in their own group; keying PRs by
# pull_request.number keeps a close run able to cancel only builds of its OWN PR.
concurrency:
  group: deploy-swa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Build and Deploy Job
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Baked into the Vite/Oryx build (this env is on the STEP, so the
          # static-web-apps-deploy Oryx build inherits it). config.ts resolves
          #   clientId = VITE_MSAL_CLIENT_ID ?? VITE_AZURE_CLIENT_ID
          #   tenantId = VITE_AZURE_TENANT_ID ?? VITE_MSAL_TENANT_ID
          # Pass BOTH naming pairs so neither clientId nor tenantId can resolve empty.
          # Prior failure: only VITE_AZURE_CLIENT_ID was set -> tenantId was "" -> "Missing MSAL config".
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"
          api_location: ""
          output_location: "dist"
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
